name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare docs site
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          cp CHANGELOG.md _site/changelog.md
          cp SECURITY.md _site/security.md
          cp CONTRIBUTING.md _site/contributing.md
          cp CODE_OF_CONDUCT.md _site/code-of-conduct.md
          cp -r docs _site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
