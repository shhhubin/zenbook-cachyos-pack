name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK: $f"
          done
      - name: Python syntax check
        run: |
          for f in scripts/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f"
          done
      - name: ShellCheck (if available)
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck -S error scripts/*.sh && echo "SHELLCHECK OK"
          else
            echo "shellcheck not preinstalled; installing"
            sudo apt-get -qq update && sudo apt-get -qq install -y shellcheck >/dev/null 2>&1
            shellcheck -S error scripts/*.sh && echo "SHELLCHECK OK"
          fi
      - name: Patch applies cleanly to upstream
        run: |
          git clone --depth 1 https://github.com/amkillam/ryzen_smu /tmp/rs
          cd /tmp/rs
          git apply --check "$GITHUB_WORKSPACE/patches/ryzen_smu-krackan-full-adapted.patch" \
            && echo "PATCH APPLIES CLEAN"
      - name: Foolproof gate — autoinstall must REFUSE non-live env
        run: |
          bash scripts/autoinstall.sh --yes DISK=/dev/null USER=ci >/tmp/ai-test.log 2>&1 && { echo "FAIL: should exit non-zero outside live ISO"; cat /tmp/ai-test.log; exit 1; }
          echo "OK: autoinstall refuses non-live (exit non-zero as expected)"
      - name: Secret scan (fail on match)
        run: |
          if grep -rniE '(BEGIN (RSA|OPENSSH|EC|PRIVATE)|api[_-]?key[[:space:]]*[=:][[:space:]]*[A-Za-z0-9]|secret[[:space:]]*[=:][[:space:]]*[A-Za-z0-9]{16,}|password[[:space:]]*[=:][[:space:]]*[A-Za-z0-9]{8,})' \
            --include='*' --exclude-dir='.git' .; then
            echo "SECRET FOUND"; exit 1
          else
            echo "SECRET SCAN CLEAN"
          fi

  # Full acceptance test: QEMU emulation of the one-line install.
  # GitHub-hosted runners have NO KVM (verified OSINT 2026-08-12) → TCG mode (slow).
  # Triggered manually (workflow_dispatch) or on tag push. Local runs use KVM via:
  #   make emulate-fast / make emulate
  emulate:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + tesseract
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y qemu-system-x86 ovmf tesseract-ocr python3-pil socat
      - name: Download CachyOS live ISO (cache-friendly)
        run: |
          mkdir -p /tmp/iso
          ISO_URL="$(curl -s https://api.github.com/repos/CachyOS/CachyOS-Live-ISO/releases/latest | python3 -c 'import sys,json; d=json.load(sys.stdin); print([a["browser_download_url"] for a in d.get("assets",[]) if a["name"].endswith(".iso")][0])')"
          echo "ISO_URL=$ISO_URL"
          curl -fL --retry 3 -o /tmp/iso/cachyos.iso "$ISO_URL"
          ls -la /tmp/iso/
      - name: Run fast emulation (skip desktop/AI)
        run: |
          export PACK_DIR="$GITHUB_WORKSPACE"
          export ISO=/tmp/iso/cachyos.iso
          bash scripts/ci-emulate.sh --skip-desktop --skip-ai
