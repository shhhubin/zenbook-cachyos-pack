name: Bug report
description: Something is broken or unsafe
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Zero-trust rule: include evidence (command output), not just description.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: git rev-parse HEAD, or release tag
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context
      description: Real machine, QEMU emulation, or CI? Which make target?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste exact command output / error / log lines
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: dmesg, journalctl, verify-install.sh output, /proc/cmdline, etc.
